<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Get in touch: hello@mostlygino.com. A walkthrough of a project, or the details behind a redacted line. Just ask.">
<defs>
 <linearGradient id="material" x1="0" y1="0" x2="0.65" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#ede5d8"/></linearGradient>
 <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.45" stop-color="#b9a991" stop-opacity="0.2"/><stop offset="1" stop-color="#b9a991" stop-opacity="0.8"/></linearGradient>
 <pattern id="weave" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 1H7M1 0V7" stroke="#b9a991" stroke-width="0.7"/><path d="M4 3h2M3 5h1" stroke="#b9a991" stroke-width="0.6"/></pattern>
 <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.2"/></filter>
</defs>
<rect x="1" y="1" width="1278" height="318" rx="24" fill="url(#material)" stroke="#b9a991"/>
<rect x="2" y="2" width="1276" height="316" rx="22" fill="url(#weave)" opacity="0.16"/><path d="M24 311H1254M27 315H1250" stroke="#b9a991" opacity="0.55"/>
<rect x="3" y="3" width="1274" height="314" rx="22" fill="none" stroke="url(#rim)"/>
  <text x="64" y="82" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" letter-spacing="2.4" fill="#62584b">CONTACT</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="62" y="154" font-size="64" font-weight="700" letter-spacing="-2" fill="#28241e">Get in <tspan fill="#795322">touch.</tspan></text>
