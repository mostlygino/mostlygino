<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Get in touch: hello@mostlygino.com. A walkthrough of a project, or the details behind a redacted line. Just ask.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f4fa"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#cfd3f6"/>
    </pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1278" height="318" rx="22" fill="url(#card)" stroke="rgba(0,0,0,0.09)" stroke-width="1.5"/>
  <rect x="1" y="1" width="1278" height="318" rx="22" fill="url(#dots)" opacity="0.18"/>
  <text x="64" y="82" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" letter-spacing="2.4" fill="rgba(60,60,67,0.62)">CONTACT</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="62" y="154" font-size="64" font-weight="700" letter-spacing="-2" fill="#000000">Get in <tspan fill="#0062cc">touch.</tspan></text>
    <text x="64" y="204" font-size="25" fill="rgba(60,60,67,0.62)">A walkthrough of a project, or the details</text>
    <text x="64" y="238" font-size="25" fill="rgba(60,60,67,0.62)">behind a redacted line. Just ask.</text>
  </g>
  <rect x="704" y="60" width="512" height="200" rx="18" fill="rgba(0,98,204,0.10)" stroke="rgba(0,0,0,0.09)"/>
  <g fill="none" stroke="#0062cc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="744" y="96" width="46" height="34" rx="6"/><path d="M747 100l20 15 20-15"/>
  </g>
  <text x="744" y="186" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="31" fill="#000000">hello@mostlygino.com</text>
  <text x="744" y="222" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="18" fill="rgba(60,60,67,0.62)">Encrypted mail welcome. Keys below.</text>
</svg>
