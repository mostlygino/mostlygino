<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="132" viewBox="0 0 1280 132" role="img" aria-label="Source is private, walkthroughs on request. And more, under bars: for the redacted details, get in touch.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#10131d"/><stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#121865"/>
    </pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1278" height="130" rx="22" fill="url(#card)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <rect x="1" y="1" width="1278" height="130" rx="22" fill="url(#dots)" opacity="0.18"/>
  <g fill="none" stroke="#4da2ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="44" y="58" width="30" height="23" rx="6"/><path d="M51 58v-7a8 8 0 0 1 16 0v7"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="96" y="60" font-size="26" font-weight="600" fill="#ffffff">Source is private.</text>
    <text x="96" y="92" font-size="20" fill="rgba(235,235,245,0.52)">Walkthroughs on request.</text>
  </g>
  <path d="M640 28v76" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <rect x="682" y="54" width="60" height="24" rx="3" fill="#000000" stroke="rgba(255,255,255,0.10)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="764" y="60" font-size="26" font-weight="600" fill="#ffffff">And more, under bars.</text>
    <text x="764" y="92" font-size="20" fill="rgba(235,235,245,0.52)">For the redacted details, get in touch.</text>
  </g>
  <text x="1232" y="80" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="34" fill="#4da2ff">→</text>
</svg>
