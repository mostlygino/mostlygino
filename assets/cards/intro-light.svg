<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="598" viewBox="0 0 1280 598" role="img" aria-label="The person between your data and a very bad day. I break into things, legally, mostly. Then I build the tools the defenders actually use, and write the policy that keeps them honest. Everything in the reel is in daily use: self-hosted, keys on the server, and the AI never gets the final say.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f4fa"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#cfd3f6"/>
    </pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1278" height="596" rx="22" fill="url(#card)" stroke="rgba(0,0,0,0.09)" stroke-width="1.5"/>
  <rect x="1" y="1" width="1278" height="596" rx="22" fill="url(#dots)" opacity="0.18"/>
  <text x="64" y="82" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" letter-spacing="2.4" fill="rgba(60,60,67,0.62)">SECURITY · COMPLIANCE · BUILD</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif"><text x="64" y="150" font-size="58" font-weight="700" letter-spacing="-2" fill="#000000">The person between your data</text><text x="64" y="214" font-size="58" font-weight="700" letter-spacing="-2" fill="#0062cc">and a very bad day.</text><text x="64" y="272" font-size="25" font-weight="600" fill="#000000">I break into things, legally, mostly. Then I build the tools the defenders actually use, and</text><text x="64" y="308" font-size="25" font-weight="600" fill="#000000">write the policy that keeps them honest.</text><text x="64" y="352" font-size="23" fill="rgba(60,60,67,0.62)">Everything in the reel is in daily use: self-hosted, keys on the server, and the AI never gets the</text><text x="64" y="386" font-size="23" fill="rgba(60,60,67,0.62)">final say.</text></g>
  <rect x="64" y="452" width="246" height="38" rx="19.0" fill="rgba(0,98,204,0.10)" stroke="#0062cc" stroke-opacity="0.55"/><text x="187" y="477" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#0062cc" fill-opacity="1">security &amp; compliance</text><rect x="320" y="452" width="194" height="38" rx="19.0" fill="rgba(0,98,204,0.10)" stroke="#0062cc" stroke-opacity="0.55"/><text x="417" y="477" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#0062cc" fill-opacity="1">ISO 27001 · NIS2</text><rect x="524" y="452" width="215" height="38" rx="19.0" fill="rgba(0,98,204,0.10)" stroke="#0062cc" stroke-opacity="0.55"/><text x="631" y="477" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#0062cc" fill-opacity="1">social engineering</text><rect x="748" y="452" width="256" height="38" rx="19.0" fill="rgba(0,98,204,0.10)" stroke="#0062cc" stroke-opacity="0.55"/><text x="876" y="477" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#0062cc" fill-opacity="1">trust &amp; safety tooling</text>
