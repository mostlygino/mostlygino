dth="142" height="38" rx="19.0" fill="none" stroke="rgba(0,0,0,0.09)" stroke-opacity="1"/><text x="888" y="529" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" fill="#000000" fill-opacity="0.78">Claude Code</text>
