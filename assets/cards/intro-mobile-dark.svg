<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-label="The person between your data and a very bad day. I break into things, legally, mostly. Then I build the tools the defenders actually use, and write the policy that keeps them honest. Security tools, personal projects, and the principles behind them: ownership, evidence, and a human with the final say.">
