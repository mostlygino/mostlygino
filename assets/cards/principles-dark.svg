<svg xmlns="http://www.w3.org/2000/svg" width="640" height="448" viewBox="0 0 640 448" role="img" aria-label="How I build: Break it before they do: I attack my own work first.; Compliance is the floor, not the finish: Passing the audit is where it starts.; Proof, or it didn&#x27;t happen: A finding without evidence is a rumour.; Boring, on purpose: Clever is where incidents start.; Hold your own keys: If I can&#x27;t hold the key, I don&#x27;t trust the lock.">
