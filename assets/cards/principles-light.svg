<svg xmlns="http://www.w3.org/2000/svg" width="640" height="448" viewBox="0 0 640 448" role="img" aria-label="How I build: The AI never has the last word; Fail closed; Missing is not clean; Keys stay on the server; Self-hosted by default; Keyboard first. Where each rule shows is redacted.">
