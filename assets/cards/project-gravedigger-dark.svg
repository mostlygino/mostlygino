<svg xmlns="http://www.w3.org/2000/svg" width="640" height="454" viewBox="0 0 640 454" role="img" aria-label="Gravedigger: Paste an indicator, get the whole story. Self-hosted abuse triage. Latest: Dozens of checks per scan, run in parallel, and a briefing that only speaks about what was actually checked. Stack: Node.js, Python, DuckDB, Playwright.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#10131d"/><stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#121865"/>
    </pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="638" height="452" rx="22" fill="url(#card)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <rect x="1" y="1" width="638" height="452" rx="22" fill="url(#dots)" opacity="0.18"/>
