="rgba(235,235,245,0.52)">that only speaks about what was actually checked.</text><rect x="40" y="378" width="96" height="36" rx="18.0" fill="none" stroke="rgba(255,255,255,0.10)" stroke-opacity="1"/><text x="88" y="402" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#ffffff" fill-opacity="0.78">Node.js</text><rect x="146" y="378" width="87" height="36" rx="18.0" fill="none" stroke="rgba(255,255,255,0.10)" stroke-opacity="1"/><text x="190" y="402" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#ffffff" fill-opacity="0.78">Python</text><rect x="243" y="378" width="87" height="36" rx="18.0" fill="none" stroke="rgba(255,255,255,0.10)" stroke-opacity="1"/><text x="286" y="402" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#ffffff" fill-opacity="0.78">DuckDB</text><rect x="339" y="378" width="126" height="36" rx="18.0" fill="none" stroke="rgba(255,255,255,0.10)" stroke-opacity="1"/><text x="402" y="402" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#ffffff" fill-opacity="0.78">Playwright</text>
