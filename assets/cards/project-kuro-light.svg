<svg xmlns="http://www.w3.org/2000/svg" width="640" height="454" viewBox="0 0 640 454" role="img" aria-label="Kuro: A minimal, void-like macOS desktop with drawn badges and motion everywhere. Latest: Drawn Wi-Fi, battery and coffee badges with live cards, and a bar that renews its own Claude login. Stack: Swift, SketchyBar, AeroSpace.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f4fa"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#cfd3f6"/>
    </pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="638" height="452" rx="22" fill="url(#card)" stroke="rgba(0,0,0,0.09)" stroke-width="1.5"/>
  <rect x="1" y="1" width="638" height="452" rx="22" fill="url(#dots)" opacity="0.18"/>
