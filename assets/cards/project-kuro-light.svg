renews its own Claude login.</text><rect x="40" y="378" width="77" height="36" rx="18.0" fill="none" stroke="rgba(0,0,0,0.09)" stroke-opacity="1"/><text x="78" y="402" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#000000" fill-opacity="0.78">Swift</text><rect x="127" y="378" width="126" height="36" rx="18.0" fill="none" stroke="rgba(0,0,0,0.09)" stroke-opacity="1"/><text x="190" y="402" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#000000" fill-opacity="0.78">SketchyBar</text><rect x="262" y="378" width="116" height="36" rx="18.0" fill="none" stroke="rgba(0,0,0,0.09)" stroke-opacity="1"/><text x="320" y="402" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#000000" fill-opacity="0.78">AeroSpace</text>
