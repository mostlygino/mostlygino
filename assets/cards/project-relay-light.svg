<svg xmlns="http://www.w3.org/2000/svg" width="640" height="454" viewBox="0 0 640 454" role="img" aria-label="Relay: A keyboard-first ticket console you'd actually want to work in. Latest: 16 ⌘ shortcuts, a demo mode, and AI drafts a human still has to send. Stack: Python, vanilla JS, per-user vaults.">
