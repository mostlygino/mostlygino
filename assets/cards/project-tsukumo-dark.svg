<svg xmlns="http://www.w3.org/2000/svg" width="640" height="454" viewBox="0 0 640 454" role="img" aria-label="Tsukumo: A script toolbox for networks, abuse handling and daily chores, behind one TUI. Latest: v1.0: one installer, three profiles, the same result on bash and PowerShell. Stack: Python, Bash, PowerShell.">
