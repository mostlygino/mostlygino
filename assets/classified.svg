<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Classified</title>
  <desc id="d">A file of redacted lines under a classified stamp. More work that cannot be named in public; ask for the file.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0c0b"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff453a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff453a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- the file: labels in the open, the text under bars -->
  <g transform="translate(760 62)">
    <rect width="436" height="236" rx="6" fill="#eeeae1" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#8e8e93">
      <text x="28" y="40">FILE  MG-26-09</text>
      <text x="28" y="84">PROJECT</text>
      <text x="28" y="132">EMPLOYER</text>
      <text x="28" y="180">IMPACT</text>
    </g>
    <g fill="#000000">
      <rect x="28" y="92" width="312" height="16" rx="2"/>
      <rect x="28" y="140" width="228" height="16" rx="2"/>
      <rect x="28" y="188" width="360" height="16" rx="2"/>
      <rect x="28" y="208" width="190" height="16" rx="2"/>
    </g>
    <!-- the stamp -->
    <g transform="translate(300 60) rotate(-12)">
      <rect x="-86" y="-22" width="172" height="44" rx="6" fill="none" stroke="#ff453a" stroke-opacity="0.85" stroke-width="3"/>
      <text x="0" y="8" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="20" font-weight="800" letter-spacing="4" fill="#ff453a" fill-opacity="0.9">CLASSIFIED</text>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="72" y="160" font-size="80" font-weight="800" letter-spacing="-2.5" fill="#f5f5f7">And <tspan fill="#ff453a">more.</tspan></text>
    <text x="76" y="206" font-size="24" font-weight="500" fill="#aeaeb2">Some work can't be named in public.</text>
    <text x="76" y="238" font-size="24" font-weight="500" fill="#aeaeb2">Ask, and you get the file.</text>
  </g>
  <text x="77" y="288" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="1.5" fill="#ff453a" fill-opacity="0.85">HELLO@MOSTLYGINO.COM  ·  MOSTLYGINO.COM/DECLASSIFY</text>
</svg>
