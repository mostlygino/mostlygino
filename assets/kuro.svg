<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 20 1280 360" role="img" aria-label="Kuro: a minimal, void-like macOS desktop with drawn badges and live cards">
  <defs>
    <radialGradient id="void" cx="72%" cy="38%" r="80%">
      <stop offset="0" stop-color="#1b1b1f"/>
      <stop offset="0.55" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#030304"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#e3b8fb"/>
      <stop offset="0.55" stop-color="#bf5af2"/>
      <stop offset="1" stop-color="#7b3a9d"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#void)"/>

  <!-- 黒, large and nearly gone, the void the name is about -->
  <text x="1210" y="330" text-anchor="end" font-size="340"
        font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif"
        fill="#1d1d21">黒</text>

  <!-- the bar, in miniature: three pills floating in the dark -->
  <g transform="translate(96 72)" font-family="-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif">
    <rect x="0" y="0" width="112" height="30" rx="15" fill="#1c1c1e" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="22" y="20" font-size="13" font-weight="600" fill="#8e8e93">1</text>
    <circle cx="56" cy="15" r="11" fill="#f5f5f7"/>
    <text x="52" y="20" font-size="13" font-weight="700" fill="#1c1c1e">2</text>
    <text x="84" y="20" font-size="13" font-weight="600" fill="#8e8e93">3</text>

    <rect x="126" y="0" width="150" height="30" rx="15" fill="#1c1c1e" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.22"/>
    <circle cx="148" cy="15" r="6.5" fill="url(#orb)"/>
    <g stroke="#d97757" stroke-width="1.6" stroke-linecap="round" transform="translate(178 15)">
      <line x1="0" y1="-3" x2="0" y2="-7.5"/><line x1="2.1" y1="-2.1" x2="5.3" y2="-5.3"/>
      <line x1="3" y1="0" x2="7.5" y2="0"/><line x1="2.1" y1="2.1" x2="5.3" y2="5.3"/>
      <line x1="0" y1="3" x2="0" y2="7.5" stroke-opacity="0.15" stroke="#ffffff"/>
      <line x1="-2.1" y1="2.1" x2="-5.3" y2="5.3" stroke-opacity="0.15" stroke="#ffffff"/>
      <line x1="-3" y1="0" x2="-7.5" y2="0" stroke-opacity="0.15" stroke="#ffffff"/>
      <line x1="-2.1" y1="-2.1" x2="-5.3" y2="-5.3" stroke-opacity="0.15" stroke="#ffffff"/>
    </g>
    <circle cx="208" cy="15" r="7" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2.4"/>
    <circle cx="208" cy="15" r="7" fill="none" stroke="#32d74b" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="33 44" transform="rotate(-90 208 15)"/>
    <g fill="#bf5af2"><circle cx="225" cy="15" r="2.1"/><circle cx="231" cy="15" r="2.1"/><circle cx="237" cy="15" r="2.1"/><circle cx="243" cy="15" r="2.1"/></g>
    <g fill="none" stroke="#f5f5f7" stroke-opacity="0.8" stroke-width="1.4" stroke-linecap="round">
      <path d="M253 10 h9 v6 a4 4 0 0 1 -4 4 h-1 a4 4 0 0 1 -4 -4 z"/><path d="M262 12 a2.2 2.2 0 0 1 0 4.4"/>
    </g>

    <rect x="290" y="0" width="150" height="30" rx="15" fill="#1c1c1e" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="306" y="20" font-size="13" font-weight="600" fill="#8e8e93">W40  Mon 28</text>
    <text x="424" y="20" font-size="13" font-weight="700" fill="#f5f5f7" text-anchor="end">10:56</text>
  </g>

  <g font-family="-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif">
    <text x="92" y="250" font-size="104" font-weight="700" letter-spacing="22" fill="#f5f5f7">KURO</text>
    <text x="96" y="300" font-size="22" font-weight="500" fill="#8e8e93" letter-spacing="1">A minimal, sleek, void-like macOS desktop.</text>
    <text x="96" y="334" font-size="16" font-weight="500" fill="#5a5a5f" letter-spacing="3">SKETCHYBAR · AEROSPACE · SWIFT HELPERS · CORE AUDIO</text>
  </g>
</svg>
