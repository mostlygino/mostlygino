    <text x="254" y="226" font-size="20" fill="#e6f6ff" fill-opacity="0.72">The ticket client you would</text>
    <text x="254" y="254" font-size="20" fill="#e6f6ff" fill-opacity="0.72">actually want to work in.</text>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif"><rect x="740" y="70" width="460" height="44" rx="10" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.7"/><text x="760" y="97" font-size="15" fill="#e6f6ff" fill-opacity="1">Phishing site on customer VPS</text><text x="1184" y="97" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#38bdf8" fill-opacity="0.8">Abuse</text><rect x="740" y="124" width="460" height="44" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/><text x="760" y="151" font-size="15" fill="#e6f6ff" fill-opacity="0.62">Portscan complaint, repeat sender</text><text x="1184" y="151" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#38bdf8" fill-opacity="0.8">Abuse</text><rect x="740" y="178" width="460" height="44" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/><text x="760" y="205" font-size="15" fill="#e6f6ff" fill-opacity="0.62">Password reset for portal</text><text x="1184" y="205" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#38bdf8" fill-opacity="0.8">Support</text><rect x="740" y="232" width="460" height="44" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/><text x="760" y="259" font-size="15" fill="#e6f6ff" fill-opacity="0.62">Spamhaus listing, /24</text><text x="1184" y="259" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#38bdf8" fill-opacity="0.8">Security</text></g>
