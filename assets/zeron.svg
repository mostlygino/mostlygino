<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">mostlygino.com</title>
  <desc id="d">mostlygino.com, codename Zeron: Apple on the surface, Unix underneath. A clean product page with a terminal window opening behind it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#040507"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ecbff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd6a5"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- the terminal, growing out of the page -->
  <g transform="translate(756 58)" filter="url(#lift)">
    <rect width="440" height="244" rx="14" fill="#101114" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect width="440" height="34" rx="14" fill="#17181c"/>
    <rect y="20" width="440" height="14" fill="#17181c"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
    <text x="220" y="22" text-anchor="middle" font-family="-apple-system,'SF Pro Text',Helvetica,Arial,sans-serif" font-size="12" fill="#8e8e93">gino@mostlygino: ~</text>
    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14">
      <text x="22" y="70" fill="#8e8e93">$ <tspan fill="#f5f5f7">whoami</tspan></text>
      <text x="22" y="92" fill="#c7c7cc">gino</text>
      <text x="22" y="122" fill="#8e8e93">$ <tspan fill="#f5f5f7">cat about.txt</tspan></text>
      <text x="22" y="144" fill="#c7c7cc">security &amp; compliance, <tspan fill="#0a84ff">mostly</tspan></text>
      <text x="22" y="174" fill="#8e8e93">$ <tspan fill="#f5f5f7">declassify</tspan></text>
      <text x="22" y="196" fill="#c7c7cc"><tspan fill="#ff453a">█████████</tspan> <tspan fill="#8e8e93">key required</tspan></text>
      <rect x="22" y="212" width="9" height="16" fill="#f5f5f7" fill-opacity="0.85"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="72" y="160" font-size="76" font-weight="700" letter-spacing="-2.5" fill="#f5f5f7">mostly<tspan fill="#0a84ff">gino</tspan></text>
    <text x="76" y="206" font-size="24" font-weight="500" fill="#aeaeb2">Apple on the surface. Unix underneath.</text>
    <rect x="76" y="228" width="50" height="24" rx="6" fill="#767680" fill-opacity="0.24"/>
    <text x="101" y="245" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="1" fill="#aeaeb2">LIVE</text>
    <text x="138" y="245" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="14" fill="url(#foil)">26.9 (20260928)</text>
  </g>
  <text x="77" y="292" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="1.5" fill="#0a84ff" fill-opacity="0.9">HIDDEN TERMINAL  ·  CTF LAYER  ·  SIGNED CERTIFICATES  ·  /DECLASSIFY</text>
</svg>
